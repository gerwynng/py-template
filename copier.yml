_subdirectory: template
_min_copier_version: "9.17.1"

# Documentation and agent instructions carry project content once a project is real, so
# the skeleton must never overwrite them - on copy into an existing tree, or on update.
# Config files are deliberately absent here: propagating their template changes is what
# update is for.
_skip_if_exists:
  - /README.md
  - /AGENTS.md
  - /CLAUDE.md

# git init comes first: `pre-commit install` writes to .git/hooks.
_message_after_copy: |
  Generated {{ project_name }}. Next:

    cd {{ _copier_conf.dst_path | quote }}
    git init
    uv sync
    uv run pre-commit install
    git add -A && git commit -m "Initial commit from py-template"

project_name:
  type: str
  help: Project name (repo and directory name, e.g. my-project)
  validator: >-
    {%- if not project_name -%}
    Required.
    {%- elif project_name != project_name | lower -%}
    Must be lowercase.
    {%- elif not project_name | regex_search('^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?$') -%}
    Must start and end with a letter or digit and contain only letters, digits, hyphens,
    underscores, or periods.
    {%- endif -%}

package_name:
  type: str
  help: Importable package name under src/
  default: "{{ project_name | replace('-', '_') | replace('.', '_') }}"
  validator: >-
    {%- if not package_name -%}
    Required.
    {%- elif package_name != package_name | lower -%}
    Must be lowercase.
    {%- elif not package_name.isidentifier() -%}
    Must be a valid Python identifier; use underscores.
    {%- elif package_name in [
      'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del',
      'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in',
      'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while',
      'with', 'yield'
    ] -%}
    Must not be a Python keyword.
    {%- endif -%}

description:
  type: str
  help: One-line description (used in pyproject and the AGENTS.md scope line)
  validator: >-
    {%- if not description | trim -%}
    Required.
    {%- elif '\n' in description or '\r' in description -%}
    Must be a single line.
    {%- endif -%}

python_version:
  type: str
  help: Minimum Python version
  default: "3.12"
  choices:
    - "3.12"
    - "3.13"
    - "3.14"
